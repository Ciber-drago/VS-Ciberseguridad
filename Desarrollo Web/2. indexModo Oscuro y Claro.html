<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Modo Claro / Oscuro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
       
        <style>
            :root {
                --bg-color: #3af800;
                --text-color: #333;
                --card-bg: #ffffff;
                --btn-bg: #333;
                --btn-text: #fff;
            }
 
            body.dark-mode {
                --bg-color: #121212;
                --text-color: #00fa36;
                --card-bg: #1e1e1e;
                --btn-bg: #06f126;
                --btn-text: hsl(0, 0%, 3%);
            }
 
            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                transition: background-color 0.3s, color 0.3s;
            }
 
            .card {
                background-color: var(--card-bg);
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
                transition: background-color 0.3s;
            }
 
            #toggle-btn {
                background-color: var(--btn-bg);
                color: var(--btn-text);
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 15px;
                transition: background-color 0.3s, color 0.3s;
            }
        </style>
    </head>
    <body>
 
        <div class="card">
            <h1>Modo Claro / Oscuro</h1>
            <p>Haz clic en el botón para cambiar el aspecto de la página.</p>
            <button id="toggle-btn" onclick="cambiarBg()">Cambiar a Modo Oscuro</button>
        </div>
 
        <script>
            // Seleccionamos el elemento body
            const bodyTEST = document.body;
 
            function cambiarBg() {
                bodyTEST.classList.toggle("dark-mode");
               
                // Cambiamos el texto del botón según el estado actual
                if (bodyTEST.classList.contains("dark-mode")) {
                    toggleBtn.textContent = "Cambiar a Modo Claro";
                } else {
                    toggleBtn.textContent = "Cambiar a Modo Oscuro";
                }
            }
        </script>
    </body>
</html>
