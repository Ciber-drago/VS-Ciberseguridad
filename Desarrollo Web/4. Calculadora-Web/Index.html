<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-container">
        <h1>CALCULADORA APP</h1>

        <div class="input-group">
            <label for="num1">Número 1:</label>
            <input type="number" id="num1" step="any">
        </div>

        <div class="input-group">
            <label for="num2">Número 2:</label>
            <input type="number" id="num2" step="any">
        </div>

        <div class="input-group">
            <select id="operation">
                <option value="" disabled selected hidden>Suma, Resta, División o Multiplicación</option>
                <option value="suma">Suma (+)</option>
                <option value="resta">Resta (-)</option>
                <option value="multiplicacion">Multiplicación (x)</option>
                <option value="division">División (÷)</option>
            </select>
        </div>

        <button id="btnExecute">EJECUTAR<br>OPERACION</button>

        <div class="input-group result-group">
            <label for="result">Resultado:</label>
            <input type="text" id="result" readonly>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
